# MagnaTagATune: 25 863 clips of about 29 s from 5405 Magnatune songs, 188 tags,
# 270 artists, from Law et al. (2009). Evaluation only: nothing is trained on it.
# Implemented in musicsim/datasets/mtt.py; details in datasets/mtt/README.md.
#
# Limitations (README section 5): 16 kHz mono MP3, so nothing above 8 kHz;
# clips of about 29.1 s padded to 30 s; a catalogue leaning towards classical,
# new age and electronic music.
# Licence (README section 6): none is published. Academic use only; nothing of
# the corpus is redistributed.

dataset:
  name: mtt
  directory: mtt              # datasets/mtt/ under $MUSICSIM_DATA_DIR

  # Tab-separated, quoted. clip_info has 31 382 rows; only the 25 863 with an
  # mp3_path have audio and are indexed.
  metadata:
    clip_info: raw/clip_info_final.csv
    comparisons: raw/comparisons_final.csv
  audio_dir: raw/audio        # 0/ ... f/, extracted from the three-part mp3.zip

  expected_items: 25863
  # Clips that appear in comparisons_final.csv (the odd-one-out votes). The 993
  # of the published figures are the subset left with a consistent constraint.
  expected_triplet_clips: 1019

  # Standard index columns: item_id, path, split, artist_id, group_id, plus
  # in_triplets. MTT has no genre labels: genre_top and genres_all are empty.
  # The split is fixed in the code by archive directory: 0-b training,
  # c validation, d-f test (12 : 1 : 3). The directories do not keep artists
  # apart; documented, not corrected.

# E07 - Do a clip's neighbours change when its audio is degraded?
# Gallery: the original clips of fma_test. Query: the perturbed clip, with its
# original (and near-duplicates) excluded from the candidates. Per condition:
# Jaccard@10 against the neighbours of the identity query, deltas of R@10 / MAP /
# nDCG@10 (perturbed minus identity, artist-clustered paired interval) and the
# position of the original over the whole gallery. The identity condition is the
# baseline of every comparison and must give Jaccard@10 = 1 and deltas of exactly
# 0. `random` carries no audio to perturb and is not part of this experiment.
# Family A (genre proxy). Report: section 06_results, "Sensitivity".

defaults:
  - ../base.yaml
  - ../datasets/fma_small.yaml
  - ../extractors/mfcc.yaml

experiment: e07_robustness

# The perturbed features are extracted by the evaluator itself.
stages: [evaluate]

representations:
  - mfcc
  - label: mfcc_pca32
    extractor: mfcc
    overrides: {embedding.pca.enabled: true, embedding.pca.n_components: 32}

evaluation:
  retrieval:
    enabled: false
  robustness:
    enabled: true
    gallery: fma_test
    # Near-duplicates are detected on this representation.
    reference: mfcc
    conditions:
      - {condition: identity}
      - {condition: noise, level: 30}      # SNR in dB
      - {condition: noise, level: 20}
      - {condition: noise, level: 10}
      - {condition: gain, level: -6}       # dB
      - {condition: gain, level: 6}
      - {condition: pitch, level: -2}      # semitones
      - {condition: pitch, level: -1}
      - {condition: pitch, level: 1}
      - {condition: pitch, level: 2}
      - {condition: tempo, level: 0.9}     # rate factor
      - {condition: tempo, level: 1.1}
      - {condition: crop, level: 15}       # seconds kept, centred
      - {condition: crop, level: 10}

outputs:
  metrics: [robustness.csv, robustness_per_query.csv]
  figures: []

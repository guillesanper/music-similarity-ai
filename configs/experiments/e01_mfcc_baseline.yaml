# E01 - Does the MFCC embedding retrieve same-genre neighbours better than chance?
# Answers SQ1 (does a representation induce a good graph on its own?) for the
# MFCC baseline. Report: section 06_results, "Retrieval baseline".

defaults:
  - ../base.yaml
  - ../datasets/fma_small.yaml
  - ../extractors/mfcc.yaml

experiment: e01_mfcc_baseline

stages: [extract, embed, graph, evaluate]

evaluation:
  retrieval:
    enabled: true
    # fma_test (~800 items, unseen artists) is the main evaluation gallery;
    # fma_all (7994) is the secondary one, kept for comparability with models
    # that have not been trained on anything (this baseline) and with the
    # archived pipeline. `queries: all` means "every gallery row queries",
    # which for fma_test is already the test split. The archived pipeline's
    # `queries=test` regression figure over the full gallery (P@10 dedup
    # 0.306) is a check, run with `-o retrieval.gallery=fma_all -o
    # retrieval.queries=test`, not a row of this experiment's output.
    galleries: [fma_test, fma_all]
    queries: all
    # The random extractor is evaluated alongside, as the chance floor.
    baselines: [random]

outputs:
  metrics: [retrieval.csv, retrieval_per_genre.csv]
  figures: []

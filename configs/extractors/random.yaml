# Negative control: vectors drawn from a fixed seed, carrying no audio
# information. Every metric reported for a model is reported for this one too,
# because "better than chance" is the first thing a reader needs to see. Phase P2.

extractor:
  name: random
  dim: 80                     # same width as the MFCC baseline
  distribution: normal
  # Derived from the run seed, so the control is reproducible without pinning a
  # second seed in every experiment.
  seed_stream: extractor/random

# Siamese head over MERT: a small MLP trained with the cosine contrastive loss
# (Hadsell et al. 2006) on top of the cached MERT titular layer, so that two
# tracks of the same genre by different artists end up close and two tracks of
# different genres far apart (musicsim.extractors.vector_siamese).
#
# The head is trained the first time this extractor runs for a given
# configuration and seed, on FMA's training split, with early stopping on
# Recall@10 over the validation split; later runs load it from
# outputs/checkpoints/siamese_emb-<hash8>/. Every key below enters that hash
# and the feature cache's, so changing any of them trains a new head.
#
# A short CPU check of the whole path:
#   python -m musicsim extract --config <experiment using this extractor> \
#       -o extractor.training.max_epochs=2

extractor:
  name: siamese_emb
  # Input: the cached vectors of another extractor. The head is always trained
  # on FMA (configs/datasets/fma_small.yaml), its input standardised with the
  # statistics of the training split; on another corpus (MTT) the same head is
  # applied to that corpus standardised on its own embedding.fit_on rows. The
  # overrides pin the settings the head is designed for: MERT's titular layer,
  # chosen once on validation.
  input:
    extractor: mert
    overrides:
      mert_layer: 6
  hidden: [512]                # 768 -> 512 -> 128
  dropout: 0.2                 # after the hidden layer
  dim: 128                     # embedding size, unit L2 norm

  training:
    # Contrastive loss on the cosine distance (in [0, 2]): negatives are pushed
    # apart only while closer than the margin. Margin and learning rate were
    # chosen on validation Recall@10 (seed 42, weight decay 1e-4) over margin
    # {0.25, 0.5, 1.0} x lr {1e-3, 1e-4}: 0.0592-0.0615, best here. The MERT
    # input on its own scores 0.0606 on the same items, so the head gains little.
    margin: 0.25
    lr: 1.0e-4                 # Adam
    weight_decay: 1.0e-4       # Adam's L2 penalty
    # PxK batches: 8 genres x 8 tracks, each genre block by at least two
    # artists. FMA small has exactly 8 genres, so every batch holds all of them.
    p: 8
    k: 8
    max_epochs: 200
    patience: 10               # epochs without a strict improvement of validation Recall@10

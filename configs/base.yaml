# Global defaults. Every other configuration file inherits from this one through
# its `defaults:` list, and overrides only what it needs to change.
#
# Constants here are the ones that were validated on the archived pipeline; the
# comment next to each says why it has the value it has.

seed: 42

# --- Audio ------------------------------------------------------------------
audio:
  sample_rate: 22050          # native rate of the FMA excerpts
  clip_seconds: 30.0          # nominal length of an FMA excerpt
  min_seconds: 1.0            # anything shorter is unusable and is dropped
  # FMA excerpts are not exactly 30 s long (track 2 decodes to 660984 samples).
  # Every clip is trimmed or zero-padded to this length so that spectrograms
  # have the same number of frames and the pooled vectors stay comparable.
  clip_samples: 661500        # = sample_rate * clip_seconds
  mono: true

# --- Log-mel spectrogram (the input of both MFCC and the CNN) ---------------
spectrogram:
  n_fft: 2048
  hop_length: 512
  n_mels: 128
  fmin: 0
  fmax: 11025                 # Nyquist at 22050 Hz

# --- Embedding post-processing ----------------------------------------------
embedding:
  # The scaler and the PCA are fitted on the training split only. Fitting them
  # on the full set would leak test statistics into the representation.
  fit_on: training
  standardize: true
  l2_normalize: true
  pca:
    enabled: false
    n_components: null

# --- Similarity graph --------------------------------------------------------
graph:
  builder: knn
  metric: cosine
  k: 10
  # Self-exclusion is done by row index, never by comparing identifiers or
  # similarity values: with duplicated vectors a value-based rule silently
  # removes the wrong neighbour.
  exclude_self: true
  # Cosine similarity at or above which two items count as near-duplicates
  # (musicsim.graphs.duplicates); the archived pipeline's value, validated
  # against FMA small's 16 known duplicate pairs.
  near_duplicate_threshold: 0.9999

# --- Retrieval evaluation ----------------------------------------------------
retrieval:
  # Headline quality metrics (see report section 5): Recall@10 (raw and
  # normalised), MAP and nDCG@10. P@10 is kept for continuity with the
  # archived repository's regression figures, but it is a secondary metric.
  ks: [1, 5, 10, 20]          # k = 10 is the headline neighbourhood size
  # `gallery` decides which items can be queries or candidates: `fma_test`
  # (default) restricts both to the ~800 test-split items (artists unseen by
  # anything fitted on training), the main evaluation for a model that was
  # actually trained. `fma_all` lifts the restriction (7994 items) and is only
  # a secondary analysis / regression check against the archived pipeline; an
  # experiment must opt into it explicitly.
  gallery: fma_test           # fma_test | fma_all
  # `queries` selects which gallery rows act as queries; with `gallery:
  # fma_test` every gallery row is already test-split, so `all` and `test`
  # coincide. With `gallery: fma_all`, `queries: test` reproduces the archived
  # pipeline's regression figure (P@10 dedup 0.306) and is kept only as that
  # check, not as a headline report row.
  queries: all                # all | test
  # dedup is the headline variant: the near-duplicate partner of a query counts
  # as the query itself, so it leaves both the ranking and the relevant set.
  variants: [dedup, raw, artist_filter]
  relevance: label_match

# --- Uncertainty --------------------------------------------------------------
bootstrap:
  n_resamples: 1000
  confidence: 0.95
  # Tracks by the same artist are not independent, so model comparisons are read
  # off the artist-clustered interval rather than the per-query one.
  levels: [query, artist]

# --- Execution ----------------------------------------------------------------
runtime:
  n_jobs: -1                  # -1 = every core
  progress: true
  cache: true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "musicsim"
version = "0.1.0"
description = "A framework for music similarity experiments: siamese networks, classical techniques and MERT compared on similarity graphs (crisp and fuzzy), evaluated with retrieval, structure, probing and human triplet judgements."
readme = "README.md"
requires-python = "==3.12.*"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["music information retrieval", "similarity", "embeddings", "graphs", "evaluation"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering",
]
# This is the single source of dependencies. The requirements*.txt files only
# forward to these lists, so a version is written down exactly once.
#
# The numeric stack is pinned to the exact versions the reference figures were
# produced with, so the regression checks between phases are meaningful.
dependencies = [
    "numpy==2.1.3",
    "scipy==1.18.1",
    "pandas==2.3.3",
    "scikit-learn==1.9.0",
    "librosa==1.0.0",
    "soundfile==0.14.0",
    "soxr==1.1.0",
    "numba==0.67.0",
    "llvmlite==0.49.0",
    "joblib==1.6.0",
    "tqdm==4.70.1",
    "matplotlib==3.11.2",
    "networkx==3.6.1",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
# Trained models and MERT. On a GPU server install the CUDA build
# first, picking the index URL that matches the driver, e.g. for CUDA 12.4:
#   pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cu124
dl = [
    "torch==2.6.0",
    "torchaudio==2.6.0",
    "transformers==4.49.0",
    "safetensors==0.5.3",
    "huggingface-hub==0.29.1",
]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.7",
]

[project.scripts]
musicsim = "musicsim.cli:main"

[tool.setuptools.packages.find]
# The package lives at the repository root; there is no src/ layout.
include = ["musicsim*"]

[tool.setuptools.package-data]
musicsim = ["resources/*.csv", "resources/*.yaml"]

# ---------------------------------------------------------------------------
# Linting
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["report", ".venv"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "B",    # bugbear
    "UP",   # pyupgrade
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",  # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["musicsim"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
filterwarnings = ["error::DeprecationWarning:musicsim.*"]
markers = [
    "slow: tests that need real audio or a downloaded dataset (deselect with -m 'not slow')",
]
